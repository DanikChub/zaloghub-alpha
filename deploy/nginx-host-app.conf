# Replace only the app.zaloghub.ru server block after the internal health check.
# Keep the existing zaloghub.ru landing page and Certbot renewal configuration.
server {
    listen 443 ssl;
    server_name app.zaloghub.ru;
    ssl_certificate /etc/letsencrypt/live/zaloghub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaloghub.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 55m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
